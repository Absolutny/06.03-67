{% extends 'base.html' %}

{% block title %}Добавить услугу{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>Создание новой спортивной услуги</h3>
        <form method="POST" action="{{ url_for('add_service') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Название услуги</label>
                <input type="text" name="title" class="form-control" required minlength="2" maxlength="100">
            </div>
            <div class="mb-3">
                <label class="form-label">Описание</label>
                <textarea name="description" class="form-control" rows="3" maxlength="500"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Стоимость (руб.)</label>
                <input type="number" step="0.01" min="0.01" max="1000000" name="price" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success">Добавить услугу</button>
        </form>
    </div>
</div>
{% endblock %}

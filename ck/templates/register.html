{% extends 'base.html' %}

{% block title %}Регистрация - СпортКомплекс{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="text-center mb-3">Регистрация</h3>
        <form method="POST" action="{{ url_for('register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input type="text" name="username" class="form-control" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]{3,32}" autocomplete="username">
                <div class="form-text">3–32 символа: латинские буквы, цифры, _ . -</div>
            </div>
            <div class="mb-3">
                <label class="form-label">ФИО</label>
                <input type="text" name="full_name" class="form-control" required minlength="2" maxlength="100">
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" required minlength="8" maxlength="128" autocomplete="new-password">
                <div class="form-text">Мин. 8 символов, заглавная буква, цифра и спецсимвол.</div>
            </div>
            <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Смена пароля - СпортКомплекс{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="text-center mb-3">Смена пароля</h3>
        <form method="POST" action="{{ url_for('change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Текущий пароль</label>
                <input type="password" name="current_password" class="form-control" required maxlength="128" autocomplete="current-password">
            </div>
            <div class="mb-3">
                <label class="form-label">Новый пароль</label>
                <input type="password" name="new_password" class="form-control" required minlength="8" maxlength="128" autocomplete="new-password">
                <div class="form-text">Мин. 8 символов, заглавная и строчная буква, цифра и спецсимвол.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Повторите новый пароль</label>
                <input type="password" name="confirm_password" class="form-control" required minlength="8" maxlength="128" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-success w-100">Сменить пароль</button>
        </form>
    </div>
</div>
{% endblock %}

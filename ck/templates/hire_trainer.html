{% extends 'base.html' %}

{% block title %}Нанять тренера{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>Регистрация учетной записи тренера</h3>
        <form method="POST" action="{{ url_for('hire_trainer') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Логин тренера</label>
                <input type="text" name="username" class="form-control" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]{3,32}" autocomplete="off">
            </div>
            <div class="mb-3">
                <label class="form-label">ФИО Тренера</label>
                <input type="text" name="full_name" class="form-control" required minlength="2" maxlength="100">
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" required minlength="8" maxlength="128" autocomplete="new-password">
                <div class="form-text">Мин. 8 символов, заглавная буква, цифра и спецсимвол.</div>
            </div>
            <button type="submit" class="btn btn-primary">Зарегистрировать тренера</button>
        </form>
    </div>
</div>
{% endblock %}

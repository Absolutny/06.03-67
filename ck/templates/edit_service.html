{% extends 'base.html' %}
{% block title %}Редактировать услугу{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>Редактирование услуги #{{ service.id }}</h3>
        <form method="POST" action="{{ url_for('edit_service', service_id=service.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Название</label>
                <input type="text" name="title" class="form-control"
                       value="{{ service.title }}" required minlength="2" maxlength="100">
                <div class="form-text">Без символов ' " &lt; &gt;</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Описание</label>
                <textarea name="description" class="form-control" rows="3"
                          maxlength="500">{{ service.description or '' }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Стоимость (руб.)</label>
                <input type="number" step="0.01" min="0.01" max="1000000" name="price"
                       value="{{ service.price }}" class="form-control" required>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Сохранить</button>
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
